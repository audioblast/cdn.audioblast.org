<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}

.flip-card {
  background-color: transparent;
  width: 200px;
  height: 200px;
  perspective: 1000px;
  float:left;
  padding:10px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
}

.flip-card-front img {
  width: 100%;
  height: 100%;
}

.flip-card-back {
  clip-path: polygon(0% 25%, 0% 75%, 50% 100%, 100% 75%, 100% 25%, 50% 0%);
  color: white;
  transform: rotateY(180deg);
}

.flip-card-back a {
  color: white;
}

.flip-card-back p {
  margin: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.flip-card-back.wildlifesystems {
  background-color: #130DFA;
}

.flip-card-back.bioacoustica {
  background-color: #61AD82;
}

.flip-card-back.audioblast {
  background-color: #F96707;
}

</style>
</head>
<body>

<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://cdn.audioblast.org/hex/wildlifesystems_hex.png" alt="wilfelife systems hex logo" ">
    </div>
    <div class="flip-card-back wildlifesystems">
      <p><a href="https://wildlife.systems">Automated sound collection</a></p>
      
    </div>
  </div>
</div>

<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://cdn.audioblast.org/hex/bioacoustica_hex.png" alt="bioacoustica hex logo" ">
    </div>
    <div class="flip-card-back bioacoustica">
    <p><a href="https://bio.acousti.ca">Sound archive</a></p>
      
    </div>
  </div>
</div>

<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://cdn.audioblast.org/hex/audioblast_hex.png" alt="audioblast hex logo" ">
    </div>
    <div class="flip-card-back audioblast">
      <p><a href="https://audioblast.org">Aggregation & Search</a></p>
      
    </div>
  </div>
</div>

</body>
</html>
